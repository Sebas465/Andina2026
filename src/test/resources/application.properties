# Pruebas: H2 en memoria en modo PostgreSQL (no hace falta tener PostgreSQL instalado)
spring.datasource.url=jdbc:h2:mem:andina;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database=h2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
jwt.secret=clave-de-pruebas-solo-para-tests-hs512-000000000000000000000000000000

# Duración de la sesión JWT en horas (Word H2.1). La lee JwtProperties.
jwt.expiration-hours=8
